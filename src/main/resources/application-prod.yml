spring:
  application:
    name: padong-be

  datasource:
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

ai:
  server:
    url: ${AI_SERVER_URL:http://172.31.23.237:8000}
  datasource:
    jdbc-url: ${AI_DB_JDBC_URL}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

swagger-config:
  server-url-https: "https://padong.site"
  server-url-http: "http://padong.site"


seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL}
  api-key: ${SEOUL_OPEN_API_KEY}


tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${TOUR_API_SERVICE_KEY}

naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

portone:
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  
sk-address-api:
  base-url: ${SK_ADDRESS_API_BASE_URL:https://apis.openapi.sk.com}
  app-key: ${SK_OPEN_API_KEY}

odsay-api:
  base-url: ${ODSAY_API_BASE_URL:https://api.odsay.com}
  api-key: ${ODSAY_API_KEY}

google-routes-api:
  base-url: ${GOOGLE_ROUTES_API_BASE_URL:https://routes.googleapis.com}
  api-key: ${GOOGLE_ROUTES_API_KEY:}
