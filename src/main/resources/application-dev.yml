spring:
  application:
    name: padong-be

  datasource:
    url: jdbc:mysql://localhost:3306/padong
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

swagger-config:
  server-url-http: "http://localhost:8080"
  server-url-https: "http://localhost:8080"

open-search:
  url: ${OPEN_SEARCH_URL:}
  username: ${OPEN_SEARCH_USERNAME:}
  password: ${OPEN_SEARCH_PASSWORD:}

seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL}
  api-key: ${SEOUL_OPEN_API_KEY}

boundary-api:
  base-url: ${BOUNDARY_API_BASE_URL:http://api.vworld.kr}
  service-key: ${BOUNDARY_API_SERVICE_KEY:}
  domain: ${BOUNDARY_API_DOMAIN:www.padong.site}

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${TOUR_API_SERVICE_KEY:}

naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID:}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:}

sk-address-api:
  base-url: ${SK_ADDRESS_API_BASE_URL:https://apis.openapi.sk.com}
  app-key: ${SK_OPEN_API_KEY:}
