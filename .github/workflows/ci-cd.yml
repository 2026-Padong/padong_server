name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make application-prod.yml from secret
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          PROD_YML_PATH="./src/main/resources/application-prod.yml"

          if [ -n "$APPLICATION_PROD_YML" ]; then
            mkdir -p "$(dirname "$PROD_YML_PATH")"
            printf '%s\n' "$APPLICATION_PROD_YML" > "$PROD_YML_PATH"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APPLICATION_PROD_YML secret is empty or unavailable."
            exit 1
          else
            echo "APPLICATION_PROD_YML secret is unavailable for this event. Keeping repository application-prod.yml."
          fi

          if ! grep -q '^cloud:' "$PROD_YML_PATH"; then
            printf '\ncloud:\n  aws:\n    region: ${AWS_REGION:ap-northeast-2}\n' >> "$PROD_YML_PATH"
          fi

          if ! grep -q '^s3:' "$PROD_YML_PATH"; then
            printf '\ns3:\n  bucket: ${S3_BUCKET:padong}\n  prefix: ${S3_PREFIX:padongBE}\n' >> "$PROD_YML_PATH"
          fi

          test -s "$PROD_YML_PATH"
          echo "application-prod.yml size: $(wc -c < "$PROD_YML_PATH") bytes"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build application
        run: ./gradlew clean build -x test

      - name: Prepare app jar
        run: |
          mkdir -p artifact
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain*.jar' | head -n 1)"
          test -n "$JAR_FILE"
          cp "$JAR_FILE" artifact/app.jar
          ls -al artifact

      - name: Build Docker image
        run: |
          docker build \
            -t padong-server:${{ github.sha }} \
            -t padong-server:latest \
            .

      - name: Save Docker image
        run: |
          docker save -o artifact/padong-server-image.tar \
            padong-server:${{ github.sha }} \
            padong-server:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: padong-server
          path: artifact/padong-server-image.tar

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      EC2_APP_DIR: /home/ubuntu/padong_server
      EC2_CONTAINER_NAME: padong-server
      EC2_PORT_MAPPING: 8080:8080
      DOCKER_NETWORK: padong-net
      REDIS_CONTAINER_NAME: redis

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: padong-server
          path: artifact

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Create runtime env file
        env:
          RDS_URL: ${{ secrets.RDS_URL }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          AI_DB_JDBC_URL: ${{ secrets.AI_DB_JDBC_URL }}
          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          SEOUL_OPEN_API_BASE_URL: ${{ secrets.SEOUL_OPEN_API_BASE_URL }}
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          SK_OPEN_API_KEY: ${{ secrets.SK_OPEN_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            RDS_URL
            RDS_USERNAME
            RDS_PASSWORD
            KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET
            AI_DB_JDBC_URL
            AI_DB_USERNAME
            AI_DB_PASSWORD
            SEOUL_OPEN_API_BASE_URL
            SEOUL_OPEN_API_KEY
            TOUR_API_SERVICE_KEY
            NAVER_NEWS_CLIENT_ID
            NAVER_NEWS_CLIENT_SECRET
            JWT_SECRET
            PORTONE_API_SECRET
            SK_OPEN_API_KEY
            ODSAY_API_KEY
          )

          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              missing_vars+=("$var_name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets: %s\n' "${missing_vars[*]}"
            exit 1
          fi

          {
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'RDS_URL=%s\n' "$RDS_URL"
            printf 'RDS_USERNAME=%s\n' "$RDS_USERNAME"
            printf 'RDS_PASSWORD=%s\n' "$RDS_PASSWORD"
            printf 'REDIS_HOST=%s\n' "$REDIS_CONTAINER_NAME"
            printf 'REDIS_PORT=6379\n'
            printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
            printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
            printf 'AI_DB_JDBC_URL=%s\n' "$AI_DB_JDBC_URL"
            printf 'AI_DB_USERNAME=%s\n' "$AI_DB_USERNAME"
            printf 'AI_DB_PASSWORD=%s\n' "$AI_DB_PASSWORD"
            printf 'SEOUL_OPEN_API_BASE_URL=%s\n' "$SEOUL_OPEN_API_BASE_URL"
            printf 'SEOUL_OPEN_API_KEY=%s\n' "$SEOUL_OPEN_API_KEY"
            printf 'TOUR_API_SERVICE_KEY=%s\n' "$TOUR_API_SERVICE_KEY"
            printf 'NAVER_NEWS_CLIENT_ID=%s\n' "$NAVER_NEWS_CLIENT_ID"
            printf 'NAVER_NEWS_CLIENT_SECRET=%s\n' "$NAVER_NEWS_CLIENT_SECRET"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'PORTONE_API_SECRET=%s\n' "$PORTONE_API_SECRET"
            printf 'SK_OPEN_API_KEY=%s\n' "$SK_OPEN_API_KEY"
            printf 'ODSAY_API_KEY=%s\n' "$ODSAY_API_KEY"
            printf 'GOOGLE_ROUTES_API_KEY=%s\n' "$GOOGLE_ROUTES_API_KEY"
          } > artifact/padong-server.env

          chmod 600 artifact/padong-server.env

      - name: Upload Docker image to EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}" \
            "mkdir -p '${EC2_APP_DIR}'"

          scp -i ~/.ssh/deploy_key \
            artifact/padong-server-image.tar \
            "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}":"${EC2_APP_DIR}/padong-server-image.tar"

          scp -i ~/.ssh/deploy_key \
            artifact/padong-server.env \
            "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}":"${EC2_APP_DIR}/padong-server.env"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}"@"${{ secrets.EC2_HOST }}" << EOF
            set -e

            echo "1. Load Docker image"
            sudo docker load -i "${EC2_APP_DIR}/padong-server-image.tar"

            echo "2. Create Docker network"
            sudo docker network create "${DOCKER_NETWORK}" || true

            echo "3. Start Redis container"
            if ! sudo docker ps -a --format '{{.Names}}' | grep -q "^${REDIS_CONTAINER_NAME}$"; then
              sudo docker run -d \
                --name "${REDIS_CONTAINER_NAME}" \
                --network "${DOCKER_NETWORK}" \
                --restart unless-stopped \
                redis:7
            else
              sudo docker start "${REDIS_CONTAINER_NAME}" || true
              sudo docker network connect "${DOCKER_NETWORK}" "${REDIS_CONTAINER_NAME}" || true
            fi

            echo "4. Stop old Spring Boot container"
            sudo docker rm -f "${EC2_CONTAINER_NAME}" || true

            echo "5. Run new Spring Boot container"
            sudo docker run -d \
              --name "${EC2_CONTAINER_NAME}" \
              --network "${DOCKER_NETWORK}" \
              --restart unless-stopped \
              -p "${EC2_PORT_MAPPING}" \
              --env-file "${EC2_APP_DIR}/padong-server.env" \
              padong-server:${{ github.sha }}

            echo "6. Show running containers"
            sudo docker ps

            echo "7. Show Spring Boot logs"
            sudo docker logs --tail=100 "${EC2_CONTAINER_NAME}"
          EOF
