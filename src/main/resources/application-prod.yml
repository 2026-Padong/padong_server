spring:
  application:
    name: padong-be

  datasource:
    url: jdbc:mysql://${DB_URL:localhost}:3306/padong
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

swagger-config:
  server-url-http: ${SWAGGER_SERVER_URL_HTTP:http://localhost:8080}
  server-url-https: ${SWAGGER_SERVER_URL_HTTPS:http://localhost:8080}

app:
  oauth2:
    front-redirect: ${FRONT_OAUTH_REDIRECT:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

open-search:
  url: ${OPEN_SEARCH_URL:}
  username: ${OPEN_SEARCH_USERNAME:}
  password: ${OPEN_SEARCH_PASSWORD:}

seoul-open-api:
  base-url: ${SEOUL_OPEN_API_BASE_URL}
  api-key: ${SEOUL_OPEN_API_KEY}


tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${TOUR_API_SERVICE_KEY:}

naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID:}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:}

jwt:
  secret: DMNKKvuQ4XyaP6Kx92fFLN1DtUxi33D66ctk5QBubQc=

portone:
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}

sk-address-api:
  base-url: ${SK_ADDRESS_API_BASE_URL:https://apis.openapi.sk.com}
  app-key: ${SK_OPEN_API_KEY:}

odsay-api:
  base-url: ${ODSAY_API_BASE_URL:https://api.odsay.com}
  api-key: ${ODSAY_API_KEY:}

google-routes-api:
  base-url: ${GOOGLE_ROUTES_API_BASE_URL:https://routes.googleapis.com}
  api-key: ${GOOGLE_ROUTES_API_KEY:}

ai:
  server:
    url: ${AI_SERVER_URL:}
  datasource:
    jdbc-url: ${AI_DB_JDBC_URL:}
    username: ${AI_DB_USERNAME:}
    password: ${AI_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:padong}
    prefix: ${S3_PREFIX:padongBE}
    upload:
      max-size-mb: 10
      allowed-content-types: image/jpeg,image/png,image/webp,application/pdf